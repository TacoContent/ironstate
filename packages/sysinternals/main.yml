---

tasks:
  - name: Install Sysinternals Suite
    tags: 
      - sysinternals
      - cli
    zip:
      src: https://download.sysinternals.com/files/SysinternalsSuite.zip
      dest: ~/.local/bin/sysinternals
      exclude:
        - '*.chm'
        - '*.txt'
        - '*.pdf'
      include:
        - '*.exe'
      creates:
        - ~/.local/bin/sysinternals/*
      state: ${{ package.state }}
      sha256:
        cache: ~/.local/bin/sysinternals/SysinternalsSuite.zip.sha256

  - name: Register sysinternals bin path
    tags: 
      - sysinternals
      - cli
    path:
      paths:
        - ~/.local/bin/sysinternals
      state: ${{ package.state }}
