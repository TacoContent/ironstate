---

tasks:
  - tags: 
      - json
      - cli
    eget:
      package: jqlang/jq
      state: ${{ package.state }}
      args:
        - --to=~/.local/bin/jq.exe
        - --upgrade-only

  - tags: 
      - yaml
      - cli
    eget:
      package: mikefarah/yq
      state: ${{ package.state }}
      args:
        - --to=~/.local/bin/yq.exe
        - --upgrade-only
        - --asset=".exe"

  - tags: 
      - cli
    eget:
      package: sharkdp/bat
      state: ${{ package.state }}
      args:
        - --to=~/.local/bin/bat.exe
        - --upgrade-only

  - tags: 
      - cli
    eget:
      package: sharkdp/fd
      state: ${{ package.state }}
      args:
        - --to=~/.local/bin/fd.exe
        - --upgrade-only
        - --asset="-gnu.zip"

  - tags: 
      - cli
    eget:
      package: tjblackheart/andcli
      state: ${{ package.state }}
      args:
        - --to=~/.local/bin/andcli.exe
        - --upgrade-only

  - tags: 
      - clipboard
      - cli
    eget:
      package: Slackadays/Clipboard
      state: ${{ package.state }}
      args:
        - --to=~/.local/bin/cb.exe
        - --upgrade-only

  - tags: 
      - security
      - cli
      - totp
    eget:
      package: replydev/cotp
      state: ${{ package.state }}
      args:
        - --to=~/.local/bin/cotp.exe
        - --upgrade-only

  - tags: 
      - env
      - cli
    eget:
      package: GBerghoff/envdiff
      state: ${{ package.state }}
      args:
        - --to=~/.local/bin/envdiff.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: 
      - env
      - cli
    eget:
      package: ankddev/envfetch
      state: ${{ package.state }}
      args:
        - --to=~/.local/bin/envfetch.exe
        - --upgrade-only
        - --asset=".exe"

  - tags: 
      - env
      - cli
    eget:
      package: mikeleppane/envx
      state: ${{ package.state }}
      args:
        - --to=~/.local/bin/envx.exe
        - --upgrade-only

  - tags: 
      - json
      - cli
    eget:
      package: antonmedv/fx
      state: ${{ package.state }}
      args:
        - --to=~/.local/bin/fx.exe
        - --upgrade-only

  - tags: 
      - security
      - cli
    winget:
      package: FiloSottile.age
      source: winget
      state: ${{ package.state }}

  - name: Install Chezmoi
    tags: 
      - dotfiles
      - cli
    winget:
      package: twpayne.chezmoi
      source: winget
      state: ${{ package.state }}

  - tags: 
      - task
      - cli
    winget:
      package: Task.Task
      source: winget
      state: ${{ package.state }}

  - tags: 
      - file-transfer
      - cli
    winget:
      package: schollz.croc
      source: winget
      state: ${{ package.state }}

  - tags: 
      - files
      - cli
    winget:
      package: yorukot.superfile
      source: winget
      state: ${{ package.state }}

  - tags: 
      - docs
      - cli
    cargo:
      package: tealdeer
      state: ${{ package.state }}