---

version: '3'

tasks:
  build:
    desc: Build the project
    cmds:
      - echo "Building the project..."
      - mkdir -p bin
      - go mod tidy
      - golangci-lint run ./...
      # - go build -o bin/ironstate.exe ./cmd/ironstate
      - goreleaser build --snapshot --clean
      - go vet ./cmd/ironstate
      - gofmt -l .
      - go test ./...