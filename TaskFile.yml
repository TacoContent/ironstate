---

version: '3'
vars:
  MACOS_USER: ryan
  MACOS_IP: '192.168.2.25'
  WSL_USER: ryan
# includes:
#   local: .local.taskfile.yml
    # taskfile: .local.taskfile.yml
    # optional: true

tasks:
  lint-linux:
    desc: Run golangci-lint with Linux build selection (matches Ubuntu CI from Windows)
    cmds:
      - pwsh -NoProfile -Command "[Environment]::SetEnvironmentVariable('GOOS','linux','Process'); golangci-lint run ./..."

  # --- CI parity -----------------------------------------------------------
  # Each task below mirrors one job/step in .github/workflows/ci.yml so a
  # failure shows up locally instead of for the first time in Actions. Keep
  # the two in sync when either changes.

  tools:
    desc: Install the CI-only Go tools (golangci-lint, govulncheck) into GOBIN
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - go install golang.org/x/vuln/cmd/govulncheck@latest

  sha256:
    desc: Regenerate install/*.sha256 for the install scripts
    cmds:
      - chmod +x ./scripts/generate-install-sha256.sh
      - chmod +x ./install/install.sh
      - chmod +x ./install/install.ps1
      - bash ./scripts/generate-install-sha256.sh

  verify:sha256:
    desc: 'CI job "verify": check install/*.sha256 matches the scripts'
    cmds:
      - bash ./scripts/verify-install-sha256.sh

  tidy:
    desc: go mod tidy across every module (root, sdk, examples)
    cmds:
      - go mod tidy
      - cd sdk && go mod tidy
      - cd examples/ironstate-handler-hosts && go mod tidy

  tidy:check:
    desc: 'CI job "lint": fail if go mod tidy would change any module''s go.mod/go.sum'
    cmds:
      - bash ./scripts/check-tidy.sh

  lint:
    desc: 'CI job "lint": golangci-lint'
    cmds:
      - golangci-lint run ./...

  vet:
    desc: 'CI job "vet-and-vuln": go vet'
    cmds:
      - go vet ./...

  vuln:
    desc: 'CI job "vet-and-vuln": govulncheck (every module, not just the root)'
    cmds:
      - govulncheck ./...
      - cd sdk && govulncheck ./...

  fmt:check:
    desc: Fail if any file is not gofmt-clean
    cmds:
      # gofmt -l exits 0 even when it lists files, so turn any output into a failure.
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "not gofmt-clean:"
          echo "$unformatted"
          exit 1
        fi

  test:
    desc: 'CI job "test": build + full test suite with coverage'
    cmds:
      - go build ./...
      - go test ./... -coverprofile=coverage.out

  race:
    desc: 'CI job "race": race detector over internal/filters (needs cgo + a C toolchain)'
    env:
      CGO_ENABLED: "1"
    cmds:
      # -race requires cgo. CI runs this on ubuntu-latest, which always has a C
      # toolchain; a dev box (especially Windows) often doesn't, so skip loudly
      # rather than fail the whole 'ci' chain on a missing compiler.
      - |
        cc="$(go env CC)"
        if ! command -v "$cc" >/dev/null 2>&1; then
          echo "⚠ skipping race detector: no C compiler ('$cc') on PATH - CI still runs this job."
          exit 0
        fi
        go test ./internal/filters/... -race

  fuzz-smoke:
    desc: 'CI job "fuzz-smoke": short fuzz runs over internal/expr'
    vars:
      FUZZTIME: '{{.FUZZTIME | default "20s"}}'
    cmds:
      - go test ./internal/expr/... -run xxx -fuzz FuzzParse -fuzztime {{.FUZZTIME}}
      - go test ./internal/expr/... -run xxx -fuzz FuzzScanSpans -fuzztime {{.FUZZTIME}}

  build-snapshot:
    desc: 'CI job "build-snapshot": goreleaser snapshot of every target'
    env:
      # cgo cross-compilation for android needs the NDK, which is only present in CI.
      IRONSTATE_SKIP_ANDROID: '{{.SKIP_ANDROID | default "true"}}'
    cmds:
      - goreleaser build --snapshot --clean

  ci:
    desc: Run every check the ci.yml workflow runs, in the same order
    cmds:
      - task: verify:sha256
      - task: tidy:check
      - task: lint
      - task: vet
      - task: vuln
      - task: fmt:check
      - task: test
      - task: race
      - task: fuzz-smoke
      - task: build-snapshot

  build:
    desc: Build the project (local dev loop - full CI parity is 'task ci')
    cmds:
      - task: sha256
      - echo "Building the project..."
      - mkdir -p bin
      - task: tidy
      - task: lint
      - goreleaser build --snapshot --clean --id ironstate-windows --id ironstate-unix
      - task: vet
      - task: fmt:check
      - task: vuln
      - go test ./...

  manpage:
    desc: Generate ironstate.1 (falls back to a stub when pandoc is unavailable)
    status:
      - test -f ironstate.1
    cmds:
      - cmd: pandoc docs/_man/ironstate.md -s -t man -o ironstate.1
        ignore_error: true
      - cmd: test -f ironstate.1 || printf '.TH IRONSTATE 1\n.SH NAME\nironstate \\- placeholder man page\n' > ironstate.1

  release:dry-run:
    desc: Build the release and render the winget/scoop/homebrew manifests into dist/ without publishing anything
    deps:
      - manpage
    env:
      IRONSTATE_DRY_RUN: "true"
      # cgo cross-compilation for android needs the NDK, which is only present in CI.
      IRONSTATE_SKIP_ANDROID: '{{.SKIP_ANDROID | default "true"}}'
    cmds:
      - goreleaser release --clean --skip=validate,announce,sign,sbom
      - echo "--- dist/scoop/ironstate.json ---"
      - cat dist/scoop/ironstate.json
      - echo "--- dist/homebrew/Casks/ironstate.rb ---"
      - cat dist/homebrew/Casks/ironstate.rb

  push:
    # deps:
    #   - build
    desc: Push the built binary to the remote server
    cmds: 
      - echo "Starting the push process..."
      - echo "Push to local bin directory"
      - cp ./dist/ironstate-windows_windows_amd64_v1/ironstate.exe ~/.local/bin/ironstate.exe
      - echo "Pushing the built binary to the remote server..."
      - scp ./dist/ironstate-unix_darwin_amd64_v1/ironstate {{.MACOS_USER}}@{{.MACOS_IP}}:/Users/{{.MACOS_USER}}/.local/bin/
      - echo "Pushing the built binary to the WSL distributions..."
      - echo "... Ubuntu ..."
      - wsl -d Ubuntu cp /home/{{.WSL_USER}}/Development/oss/ironstate/dist/ironstate-unix_linux_amd64_v1/ironstate /home/{{.WSL_USER}}/.local/bin/
      - echo "... Debian ..."
      - wsl -d Debian cp /home/{{.WSL_USER}}/Development/oss/ironstate/dist/ironstate-unix_linux_amd64_v1/ironstate /home/{{.WSL_USER}}/.local/bin/
      # - echo "... KaliLinux ..."
      # - wsl -d KaliLinux cp /home/{{.WSL_USER}}/Development/oss/ironstate/dist/ironstate-unix_linux_amd64_v1/ironstate /home/{{.WSL_USER}}/.local/bin/
      - echo "... ArchLinux ..."
      - wsl -d ArchLinux cp /home/{{.WSL_USER}}/Development/oss/ironstate/dist/ironstate-unix_linux_amd64_v1/ironstate /home/{{.WSL_USER}}/.local/bin/
      - echo "... Alpine ..."
      - wsl -d Alpine cp /home/{{.WSL_USER}}/Development/oss/ironstate/dist/ironstate-unix_linux_amd64_v1/ironstate /home/{{.WSL_USER}}/.local/bin/
      - echo "... DONE ..."