version: 2

project_name: ironstate
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

release:
  prerelease: auto
  # IRONSTATE_DRY_RUN=true builds everything and writes the package manifests to
  # dist/ without creating a GitHub release or pushing to the tap repos.
  disable: '{{ envOrDefault "IRONSTATE_DRY_RUN" "false" }}'

before:
  hooks:
    - go mod tidy

builds:
  - id: ironstate-windows
    main: ./cmd/ironstate
    binary: ironstate
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/TacoContent/ironstate/internal/cli.version={{.Version}}
      - -X github.com/TacoContent/ironstate/internal/cli.commit={{.ShortCommit}}
      - -X github.com/TacoContent/ironstate/internal/cli.date={{.Date}}
    hooks:
      pre:
        - go tool go-winres make --in winres/winres.json --arch={{ .Arch }} --product-version={{ .Version }} --file-version={{ .Version }} --out ./cmd/ironstate/rsrc

      post:
        - rm -f cmd/ironstate/rsrc_*.syso
  - id: ironstate-unix
    main: ./cmd/ironstate
    binary: ironstate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/TacoContent/ironstate/internal/cli.version={{.Version}}
      - -X github.com/TacoContent/ironstate/internal/cli.commit={{.ShortCommit}}
      - -X github.com/TacoContent/ironstate/internal/cli.date={{.Date}}
  - id: ironstate-android
    main: ./cmd/ironstate
    binary: ironstate
    skip: '{{ envOrDefault "IRONSTATE_SKIP_ANDROID" "false" }}'
    env:
      - CGO_ENABLED=1
      - CC={{ envOrDefault "ANDROID_NDK_LATEST_HOME" "" }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
      - CXX={{ envOrDefault "ANDROID_NDK_LATEST_HOME" "" }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++
    goos:
      - android
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X github.com/TacoContent/ironstate/internal/cli.version={{.Version}}
      - -X github.com/TacoContent/ironstate/internal/cli.commit={{.ShortCommit}}
      - -X github.com/TacoContent/ironstate/internal/cli.date={{.Date}}

archives:
  - id: ironstate
    formats: [zip]
    format_overrides:
      - goos: android
        formats: [tar.gz]
      - goos: linux
        formats: [tar.gz]
      - goos: darwin
        formats: [tar.gz]
    wrap_in_directory: false
    files:
      - README.md
      - LICENSE
      - ironstate.1

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

sboms:
  - id: ironstate-sbom
    artifacts: archive

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{.ShortCommit}}"

winget:
  - name: ironstate
    skip_upload: '{{ if eq (envOrDefault "IRONSTATE_DRY_RUN" "false") "true" }}true{{ else }}auto{{ end }}'
    publisher: camalot
    author: Ryan Conrad
    package_name: ironstate
    package_identifier: camalot.ironstate
    # Explicit so the manifests can also be rendered with the release pipe disabled.
    url_template: "https://github.com/TacoContent/ironstate/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    short_description: ironstate is a declarative, Ansible-style task runner driven by YAML.
    description: ironstate is a declarative, Ansible-style task runner driven by YAML.
    license: MIT
    commit_msg_template: "chore(winget): update manifest {{ .ProjectName }}@{{ .Version }}"
    license_url: https://github.com/TacoContent/ironstate/blob/develop/LICENSE
    copyright: "Copyright © 2026 TacoContent"
    release_notes: "{{.Changelog}}"
    tags:
      - installer
      - github
      - cli
      - system-state
    repository:
      owner: camalot
      name: scoop
      branch: main
      token: '{{ .Env.IRONSTATE_APP_TOKEN }}'
    commit_author:
      name: '{{ .Env.IRONSTATE_BOT_NAME }}'
      email: '{{ .Env.IRONSTATE_BOT_EMAIL }}'
# https://goreleaser.com/customization/publish/homebrew_casks/
homebrew_casks:
  - repository:
      owner: camalot
      name: scoop
      branch: main
      token: '{{ .Env.IRONSTATE_APP_TOKEN }}'
    skip_upload: '{{ if eq (envOrDefault "IRONSTATE_DRY_RUN" "false") "true" }}true{{ else }}auto{{ end }}'
    commit_msg_template: "chore(homebrew): update manifest {{ .ProjectName }}@{{ .Version }}"
    homepage: https://github.com/TacoContent/ironstate
    description: ironstate is a declarative, Ansible-style task runner driven by YAML.
    url:
      template: "https://github.com/TacoContent/ironstate/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    binaries:
      - ironstate
    manpages:
      - ironstate.1
    generate_completions_from_executable:
      executable: ironstate
      args:
        - "completion"
      base_name: ironstate
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish
        - pwsh
    commit_author:
      name: '{{ .Env.IRONSTATE_BOT_NAME }}'
      email: '{{ .Env.IRONSTATE_BOT_EMAIL }}'

# https://goreleaser.com/customization/publish/scoop/
scoops:
  - repository:
      owner: camalot
      name: scoop
      branch: main
      token: '{{ .Env.IRONSTATE_APP_TOKEN }}'
    skip_upload: '{{ if eq (envOrDefault "IRONSTATE_DRY_RUN" "false") "true" }}true{{ else }}auto{{ end }}'
    url_template: "https://github.com/TacoContent/ironstate/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

    commit_msg_template: "chore(scoop): update manifest {{ .ProjectName }}@{{ .Version }}"
    homepage: https://github.com/TacoContent/ironstate
    description: ironstate is a declarative, Ansible-style task runner driven by YAML.
    license: MIT
    commit_author:
      name: '{{ .Env.IRONSTATE_BOT_NAME }}'
      email: '{{ .Env.IRONSTATE_BOT_EMAIL }}'

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
