---
name: 'Validate IronState Playbooks'
description: 'Validates IronState playbooks'

inputs:
  playbooks-path:
    description: 'The directory containing the playbooks to validate'
    required: false
    default: 'playbooks'

outputs:
  validation_result:
    description: 'The result of the playbook validation'

runs:
  using: "composite"
  steps:
    - name: Install IronState
      uses: camalot/xget-action@v1
      with:
        package: TacoContent/ironstate
        ignore: |
          .sbom.json

    - name: Validate IronState Playbooks
      shell: bash
      run: |
        set -uo pipefail
        status_exit=0
        {
          echo "# IronState Playbooks Validation"
          echo
        } >> "$GITHUB_STEP_SUMMARY"
        for playbook in ${INPUT_PLAYBOOKS_PATH}/*; do
          [ -d "$playbook" ] || continue
          echo "::group::Validating $playbook"
          exit_code=0
          result=$(ironstate validate --playbook="$playbook" 2>&1) || exit_code=$?
          echo "$result"
          echo "::endgroup::"
          if [ "$exit_code" -ne 0 ]; then
            echo "::error::Validation failed for $playbook (exit $exit_code)"
            status_icon="❌"
            status_exit=1
          else
            status_icon="✅"
          fi
          {
            echo "<details><summary>$status_icon $playbook</summary>"
            echo
            echo '```text'
            echo "$result"
            echo '```'
            echo
            echo "</details>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
        done
        exit $status_exit
