name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload artifacts
  id-token: write # OIDC for cosign keyless signing + build provenance attestation

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser's changelog needs full history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        id: goreleaser
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.zip,dist/*.tar.gz,dist/checksums.txt"
