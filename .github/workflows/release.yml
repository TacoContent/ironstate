name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser's changelog needs full history
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        id: goreleaser
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.zip,dist/*.tar.gz,dist/checksums.txt"
