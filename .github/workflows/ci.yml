name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for golangci-lint's changelog generation
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  vet-and-vuln:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for govulncheck's changelog generation
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # Windows carries the full suite (incl. //go:build windows-tagged
  # handler tests added in later phases); ubuntu-latest only exercises the
  # OS-agnostic packages — not a symmetric full-suite run, see
  # docs/plans/go-rewrite.md §6/§9.
  test:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for coverage's changelog generation
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./... -coverprofile=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out

  # go test -race requires cgo (a C toolchain); only ubuntu-latest has one
  # available out of the box in GitHub-hosted runners.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for coverage's changelog generation
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/filters/... -race

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for coverage's changelog generation
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/expr/... -run xxx -fuzz FuzzParse -fuzztime 20s
      - run: go test ./internal/expr/... -run xxx -fuzz FuzzScanSpans -fuzztime 20s

  build-snapshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for goreleaser's changelog generation
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean
