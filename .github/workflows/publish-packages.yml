name: publish packages

# Manually re-runs only the winget/scoop/homebrew cask publish pipes for a tag
# that already has a GitHub release (e.g. because that step failed on the
# initial run). Rebuilds the archives locally so checksums match what's
# already uploaded, but skips creating/updating the GitHub release itself.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish package manifests for (e.g. v0.4.3)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0 # goreleaser's changelog needs full history
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: camalot/xget-action@v1
        with:
          package: jgm/pandoc
          asset-filters: ".tar.gz"

      - name: Generate man page
        run: pandoc docs/_man/ironstate.md -s -t man -o ironstate.1

      - uses: anchore/sbom-action/download-syft@v0

      - uses: actions/create-github-app-token@v3.2.0
        id: ironstate-bot-token
        with:
          client-id: ${{ vars.XGET_APP_CLIENT_ID }}
          installation-id: ${{ vars.XGET_APP_INSTALL_ID }}
          private-key: ${{ secrets.XGET_APP_PRIVATE_KEY }}
          owner: camalot
          # only needs push access to the tap repo (winget/scoop/homebrew manifests) -
          # ironstate's own git operations here use github.token
          repositories: |
            scoop
          permission-contents: write

      - uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        with:
          distribution: goreleaser
          version: latest
          # skip=github leaves the already-published GitHub release/assets alone
          args: release --clean --skip=validate,announce,sign,sbom,github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IRONSTATE_APP_TOKEN: ${{ steps.ironstate-bot-token.outputs.token }}
          IRONSTATE_BOT_NAME: ${{ vars.XGET_APP_USERNAME }}
          IRONSTATE_BOT_EMAIL: ${{ vars.XGET_APP_USEREMAIL }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}

  chocolatey:
    permissions:
      contents: read
    uses: ./.github/workflows/publish-chocolatey.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
