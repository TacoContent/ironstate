---

tasks:


  - name: Install Mozilla Firefox
    tags:
      - productivity.browsers
      - productivity.browsers.firefox
    winget:
      package: Mozilla.Firefox
      state: ${{ productivity.browsers | enabled('firefox') | ternary('present', 'absent') }}

  - name: Install Mozilla Firefox Beta
    tags:
      - productivity.browsers
      - productivity.browsers.firefox_beta
    winget:
      package: Mozilla.Firefox.Beta.MSIX
      state: ${{ productivity.browsers | enabled('firefox_beta') | ternary('present', 'absent') }}

  - name: Install Mozilla Firefox Developer Edition
    tags:
      - productivity.browsers
      - productivity.browsers.firefox_dev
    winget:
      package: Mozilla.Firefox.DeveloperEdition.MSIX
      state: ${{ productivity.browsers | enabled('firefox_dev') | ternary('present', 'absent') }}