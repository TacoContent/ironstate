---

tasks:

  - name: Install Google Chrome
    tags:
      - productivity.browsers
      - productivity.browsers.chrome
    winget:
      package: Google.Chrome
      state: ${{ productivity.browsers | enabled('chrome') | ternary('present', 'absent') }}

  - name: Install Google Chrome Beta
    tags:
      - productivity.browsers
      - productivity.browsers.chrome_beta
    winget:
      package: Google.Chrome.Beta
      state: ${{ productivity.browsers | enabled('chrome_beta') | ternary('present', 'absent') }}

  - name: Install Google Chrome Canary
    tags:
      - productivity.browsers
      - productivity.browsers.chrome_canary
    winget:
      package: Google.Chrome.Canary
      state: ${{ productivity.browsers | enabled('chrome_canary') | ternary('present', 'absent') }}

  - name: Install Google Chrome Dev
    tags:
      - productivity.browsers
      - productivity.browsers.chrome_dev
    winget:
      package: Google.Chrome.Dev
      state: ${{ productivity.browsers | enabled('chrome_dev') | ternary('present', 'absent') }}