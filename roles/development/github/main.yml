---

tasks:
  - name: GitHub Copilot App
    tags:
      - github
      - development
      - development.github
      - development.github.copilot
    when: development.github | enabled('copilot')
    winget:
      package: GitHub.CopilotApp
      state: ${{ package.state }}

  - name: GitHub Copilot CLI
    tags:
      - github
      - development
      - development.github
      - development.github.copilot
    when: development.github | enabled('copilot')
    winget:
      package: GitHub.Copilot
      state: ${{ package.state }}

  - name: GitHub CLI (gh)
    tags:
      - github
      - development
      - development.github
      - development.github.gh
    when: development.github | enabled('gh')
    winget:
      package: GitHub.cli
      state: ${{ package.state }}

  - name: GitHub Desktop
    tags:
      - github
      - development
      - development.github
      - development.github.desktop
    when: development.github | enabled('desktop')
    winget:
      package: GitHub.GitHubDesktop
      state: ${{ package.state }}

  - name: GitHub hub CLI
    tags:
      - github
      - development
      - development.github
      - development.github.hub
    when: development.github | enabled('hub')
    winget:
      package: GitHub.hub
      state: ${{ package.state }}

  - name: Render commercial GitHub SSH host
    tags:
      - github
      - development
    when: github.commercial is defined
    ssh_host_block:
      create: true
      dest: ~/.ssh/config
      marker_name: github-commercial
      hosts:
        - comment: "Commercial github"
          host: ${{ github.commercial.host }}
          identity_file: ${{ github.commercial.identity_file }}
          user: git
          identities_only: yes

  - name: Render enterprise GitHub SSH hosts
    tags:
      - github
      - development
    when: github.enterprise is defined
    ssh_host_block:
      create: true
      dest: ~/.ssh/config
      marker_name: github-enterprise
      comment_template: "Enterprise: {host} (orgs: {orgs})"
      defaults:
        user: git
        identities_only: yes
      hosts: ${{ github.enterprise | default([]) }}
