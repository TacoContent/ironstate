---

tasks:
  - name: GitHub Copilot App
    tags:
      - github
      - development
      - development.github
      - development.github.copilot
    when: development.github | enabled('copilot')
    winget:
      package: GitHub.CopilotApp
      state: "${{ development.github | enabled('copilot') | ternary('present', 'absent') }}"

  - name: GitHub Copilot CLI
    tags:
      - github
      - development
      - development.github
      - development.github.copilot
    when: development.github | enabled('copilot')
    winget:
      package: GitHub.Copilot
      state: "${{ development.github | enabled('copilot') | ternary('present', 'absent') }}"

  - name: GitHub CLI (gh)
    tags:
      - github
      - development
      - development.github
      - development.github.gh
    when: development.github | enabled('gh')
    winget:
      package: GitHub.cli
      state: "${{ development.github | enabled('gh') | ternary('present', 'absent') }}"

  - name: GitHub Desktop
    tags:
      - github
      - development
      - development.github
      - development.github.desktop
    when: development.github | enabled('desktop')
    winget:
      package: GitHub.GitHubDesktop
      state: "${{ development.github | enabled('desktop') | ternary('present', 'absent') }}"

  - name: GitHub hub CLI
    tags:
      - github
      - development
      - development.github
      - development.github.hub
    when: development.github | enabled('hub')
    winget:
      package: GitHub.hub
      state: "${{ development.github | enabled('hub') | ternary('present', 'absent') }}"

  - name: Install nektos/act
    tags:
      - development
      - development.github
      - development.github.act
    eget:
      package: nektos/act
      state: "${{ development.github | enabled('act') | ternary('present', 'absent') }}"

      args:
        - --to=~/.local/bin/act.exe
        - --upgrade-only

  - name: Install dhth/act3
    tags: 
      - development
      - development.github
      - development.github.act3
    go:
      package: github.com/dhth/act3
      version: latest
      state: "${{ development.github | enabled('act3') | ternary('present', 'absent') }}"

  - name: Install akunzai/gistui
    tags:
      - development
      - development.github
      - development.github.gistui
    eget:
      package: akunzai/gistui
      state: "${{ development.github | enabled('gistui') | ternary('present', 'absent') }}"
      args:
        - --to=~/.local/bin/gistui.exe
        - --upgrade-only

  - name: Render commercial GitHub SSH host
    tags:
      - development
      - development.github
      - development.github.ssh
    when: github.commercial is defined
    ssh_host_block:
      create: true
      dest: ~/.ssh/config
      marker_name: github-commercial
      hosts:
        - comment: "Commercial github"
          host: ${{ github.commercial.host }}
          identity_file: ${{ github.commercial.identity_file }}
          user: git
          identities_only: yes

  - name: Render enterprise GitHub SSH hosts
    tags:
      - development.github
      - development.github.ssh
    when: github.enterprise is defined
    ssh_host_block:
      create: true
      dest: ~/.ssh/config
      marker_name: github-enterprise
      comment_template: "Enterprise: {host} (orgs: {orgs})"
      defaults:
        user: git
        identities_only: yes
      hosts: ${{ github.enterprise | default([]) }}
