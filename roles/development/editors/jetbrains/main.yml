---

tasks:

  - name: Include JetBrains GoLand Editor Role
    tags:
      - development
      - development.editors
      - development.editors.goland
      - goland
    when: development.editors | enabled('goland')
    include:
      name: roles/development/editors/jetbrains/goland
      state: ${{ development.editors | enabled('goland') | ternary('present', 'absent') }}

  - name: Include JetBrains Aqua Editor Role
    tags:
      - development
      - development.editors
      - development.editors.aqua
      - aqua
