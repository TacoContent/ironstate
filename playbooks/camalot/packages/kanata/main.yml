---

tasks:
  - name: Install Kanata
    tags: 
      - keyboard
      - kanata
    eget:
      package: jtroo/kanata
      state: ${{ package.state }}
      args:
        - --to=~/.local/bin/kanata
        - --upgrade-only
        - --asset=".zip"

  - name: Copy Kanata Keyboard Layout
    tags: 
      - keyboard
      - kanata
    copy:
      src: files/kanata.kbd
      dest: ~/.kanata/kanata.kbd
      state: ${{ package.state }}

  - name: Copy Kanata Run Script
    tags: 
      - keyboard
      - kanata
    copy:
      src: files/kanata-run.bat
      dest: ~/.local/bin/kanata-run.bat
      state: ${{ package.state }}

  - name: Create Symlink for Kanata Executable
    tags: 
      - keyboard
      - kanata
    symlinks:
      src: ~/.local/bin/kanata/kanata_windows_gui_winIOv2_cmd_allowed_x64
      dest: ~/.local/bin/kanata.exe
      state: ${{ package.state }}
