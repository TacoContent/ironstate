---

tasks:
  - name: Install Gum
    tags: 
      - tui
      - cli
    eget:
      package: charmbracelet/gum
      state: present
      args:
        - --to=${{ facts.local_bin_path | join("gum.exe") }}
        - --upgrade-only

  - name: Install JQ
    tags: 
      - json
      - cli
    eget:
      package: jqlang/jq
      state: ${{ package.state }}
      args:
        - --to=${{ facts.local_bin_path | join("jq.exe") }}
        - --upgrade-only

  - name: Install YQ
    tags: 
      - yaml
      - cli
    eget:
      package: mikefarah/yq
      state: ${{ package.state }}
      args:
        - --to=${{ facts.local_bin_path | join("yq.exe") }}
        - --upgrade-only
        - --asset=".exe"

  - name: Install Bat
    tags:
      - cli
    eget:
      package: sharkdp/bat
      state: ${{ package.state }}
      args:
        - --to=${{ facts.local_bin_path | join("bat.exe") }}
        - --upgrade-only

  - name: Install FD
    tags: 
      - cli
    eget:
      package: sharkdp/fd
      state: ${{ package.state }}
      args:
        - --to=${{ facts.local_bin_path | join("fd.exe") }}
        - --upgrade-only
        - --asset="-gnu.zip"

  - name: Install Andcli
    tags: 
      - cli
    eget:
      package: tjblackheart/andcli
      state: ${{ package.state }}
      args:
        - --to=${{ facts.local_bin_path | join("andcli.exe") }}
        - --upgrade-only

  - name: Install Clipboard
    tags:
      - clipboard
      - cli
    eget:
      package: Slackadays/Clipboard
      state: ${{ package.state }}
      args:
        - --to=${{ facts.local_bin_path | join("cb.exe") }}
        - --upgrade-only

  - name: Install Envdiff
    tags: 
      - env
      - cli
    eget:
      package: GBerghoff/envdiff
      state: ${{ package.state }}
      args:
        - --to=${{ facts.local_bin_path | join("envdiff.exe") }}
        - --upgrade-only
        - --asset=".zip"

  - name: Install Envfetch
    tags:
      - env
      - cli
    eget:
      package: ankddev/envfetch
      state: ${{ package.state }}
      args:
        - --to=${{ facts.local_bin_path | join("envfetch.exe") }}
        - --upgrade-only
        - --asset=".exe"

  - name: Install Envx
    tags: 
      - env
      - cli
    eget:
      package: mikeleppane/envx
      state: ${{ package.state }}
      args:
        - --to=${{ facts.local_bin_path | join("envx.exe") }}
        - --upgrade-only

  - name: Install Fx
    tags: 
      - json
      - cli
    eget:
      package: antonmedv/fx
      state: ${{ package.state }}
      args:
        - --to=${{ facts.local_bin_path | join("fx.exe") }}
        - --upgrade-only

  - name: Install Chezmoi
    tags: 
      - dotfiles
      - cli
    winget:
      package: twpayne.chezmoi
      source: winget
      state: ${{ package.state }}

  - name: Install Task
    tags: 
      - task
      - cli
    winget:
      package: Task.Task
      source: winget
      state: ${{ package.state }}

  - name: Install Croc
    tags:
      - file-transfer
      - cli
    winget:
      package: schollz.croc
      source: winget
      state: ${{ package.state }}

  - name: Install Superfile
    tags: 
      - files
      - cli
    winget:
      package: yorukot.superfile
      source: winget
      state: ${{ package.state }}

  - name: Install Tealdeer
    tags: 
      - docs
      - cli
    cargo:
      package: tealdeer
      state: ${{ package.state }}

  - name: Install Dust
    tags: 
      - cli
    eget:
      package: bootandy/dust
      state: present
      args:
        - --to=${{ facts.local_bin_path | join("dust.exe") }}
        - --upgrade-only

  - name: Install Fastfetch
    tags:
      - system-info
      - cli
    eget:
      package: fastfetch-cli/fastfetch
      state: present
      args:
        - --to=${{ facts.local_bin_path | join("fastfetch.exe") }}
        - --upgrade-only
        - --asset=".zip"

  - name: Install Procs
    tags: 
      - process
      - cli
    eget:
      package: dalance/procs/
      state: present
      args:
        - --to=${{ facts.local_bin_path | join("procs.exe") }}
        - --upgrade-only

  - name: Install Sd
    tags:
      - text
      - cli
    eget:
      package: chmln/sd
      state: present
      args:
        - --to=${{ facts.local_bin_path | join("sd.exe") }}
        - --upgrade-only

  - name: Install totp-cli
    tags: 
      - security
      - cli
      - totp
    eget:
      package: yitsushi/totp-cli
      state: present
      args:
        - --to=${{ facts.local_bin_path | join("totp.exe") }}
        - --upgrade-only
        - --asset=".zip"

  - name: Install Hostctl
    tags: 
      - hosts
      - cli
    eget:
      package: guumaster/hostctl
      state: present
      args:
        - --to=${{ facts.local_bin_path | join("hostctl.exe") }}
        - --upgrade-only
        - --asset="64-bit.zip"

  - tags: 
      - weather
      - cli
    eget:
      package: Tairesh/rustormy
      state: present
      args:
        - --to=${{ facts.local_bin_path | join("rustormy.exe") }}
        - --upgrade-only
        - --asset=".zip"

  - name: Install NBping
    tags: 
      - network
      - cli
    eget:
      package: hanshuaikang/NBping
      state: present
      args:
        - --to=${{ facts.local_bin_path | join("nbping.exe") }}
        - --upgrade-only
        - --asset=".zip"