---

tasks:

  - name: Sysinternals Suite
    when: system.tools | enabled('sysinternals')
    include:
      name: roles/system/tools/sysinternals
    tags:
      - system
      - system.tools
      - system.tools.sysinternals

  - name: UniGetUI
    when: system.tools | enabled('unigetui')
    winget:
      package: Devolutions.UniGetUI
      state: "${{ system.tools.unigetui | ternary('present', 'absent') }}"
    tags:
      - system
      - system.tools
      - system.tools.unigetui

  - name: Blender
    when: system.tools | enabled('blender')
    winget:
      package: BlenderFoundation.Blender
      state: "${{ system.tools.blender | ternary('present', 'absent') }}"
    tags:
      - system
      - system.tools
      - system.tools.blender

  - name: Paint.NET
    when: system.tools | enabled('paintnet')
    winget:
      package: dotPDN.PaintDotNet
      state: "${{ system.tools.paintnet | ternary('present', 'absent') }}"
    tags:
      - system
      - system.tools
      - system.tools.paintnet