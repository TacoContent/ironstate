---

vars:
  monitoring: false
  cli: true
  languages:
    rust: true
    python: true
    nodejs: true
    golang: true
    java: false
      # jre: false
      # jdk: EclipseAdoptium.Temurin.21.JDK
    dotnet: true
    ruby: false

tasks:

  - name: Install Languages
    include:
      name: languages
      state: present
    tags:
      - languages

  - name: System Tweak Tools
    include:
      name: tweaks
      state: present
    tags:
      - tweaks
      - configuration
      - utility

  - name: Install Windows Terminal
    include:
      name: terminal
      state: present
    tags:
      - terminal
      - cli

  - name: Install smartmontools
    include:
      name: smartctl
      state: present
    when: monitoring
    tags:
      - smartctl
      - monitor

  - name: Install CLI Tools
    include:
      name: cli
      state: present
    when: cli
    tags:
      - cli

  - tags: [cli]
    eget:
      package: zyedidia/eget
      state: latest
      args:
        - --to=~/.local/bin/eget.exe
        - --upgrade-only


  - tags: [git, cli]
    eget:
      package: dandavison/delta
      state: present
      args:
        - --to=~/.local/bin/delta.exe
        - --upgrade-only

  - tags: [cli]
    eget:
      package: bootandy/dust
      state: present
      args:
        - --to=~/.local/bin/dust.exe
        - --upgrade-only


  - tags: [system-info, cli]
    eget:
      package: fastfetch-cli/fastfetch
      state: present
      args:
        - --to=~/.local/bin/fastfetch.exe
        - --upgrade-only
        - --asset=".zip"


  - tags: [security, cli, totp]
    eget:
      package: pcarrier/gauth
      state: present
      args:
        - --to=~/.local/bin/gauth.exe
        - --upgrade-only

  - tags: [security, cli, password-store]
    eget:
      package: reyamira/pass-cli
      state: present
      args:
        - --to=~/.local/bin/pass-cli.exe
        - --upgrade-only
        - --asset=".tar.gz"

  - tags: [git, cli]
    eget:
      package: byawitz/ggh
      state: present
      args:
        - --to=~/.local/bin/ggh.exe
        - --upgrade-only

  - tags: [git, gist, cli]
    eget:
      package: akunzai/gistui
      state: present
      args:
        - --to=~/.local/bin/gistui.exe
        - --upgrade-only

  - tags: [git, changelog, cli]
    eget:
      package: orhun/git-cliff
      state: present
      args:
        - --to=~/.local/bin/git-cliff.exe
        - --upgrade-only

  - tags: [tui, cli]
    eget:
      package: charmbracelet/gum
      state: present
      args:
        - --to=~/.local/bin/gum.exe
        - --upgrade-only

  - tags: [process, cli]
    eget:
      package: dalance/procs/
      state: present
      args:
        - --to=~/.local/bin/procs.exe
        - --upgrade-only

  - tags: [text, cli]
    eget:
      package: chmln/sd
      state: present
      args:
        - --to=~/.local/bin/sd.exe
        - --upgrade-only

  - tags: [git, versioning, cli]
    eget:
      package: caarlos0/svu
      state: present
      args:
        - --to=~/.local/bin/svu.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [security, cli, totp]
    eget:
      package: yitsushi/totp-cli
      state: present
      args:
        - --to=~/.local/bin/totp.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [hosts, cli]
    eget:
      package: guumaster/hostctl
      state: present
      args:
        - --to=~/.local/bin/hostctl.exe
        - --upgrade-only
        - --asset="64-bit.zip"

  - tags: [kubernetes, cli]
    eget:
      package: kdash-rs/kdash
      state: absent
      args:
        - --to=~/.local/bin/kdash.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [kubernetes, cli]
    eget:
      package: stern/stern
      state: absent
      args:
        - --to=~/.local/bin/stern.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [kubernetes, cli]
    eget:
      package: derailed/k9s
      state: absent
      args:
        - --to=~/.local/bin/k9s.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [kubernetes, cli]
    eget:
      package: derailed/popeye
      state: absent
      args:
        - --to=~/.local/bin/popeye.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [security, cli, sbom]
    eget:
      package: anchore/syft
      state: absent
      args:
        - --to=~/.local/bin/syft.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [security, cli, vulnerability-scanning]
    eget:
      package: anchore/grype
      state: absent
      args:
        - --to=~/.local/bin/grype.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [network, cli]
    eget:
      package: hanshuaikang/NBping
      state: present
      args:
        - --to=~/.local/bin/nbping.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [weather, cli]
    eget:
      package: Tairesh/rustormy
      state: present
      args:
        - --to=~/.local/bin/rustormy.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [shell, cli]
    eget:
      package: koalaman/shellcheck
      state: present
      args:
        - --to=~/.local/bin/shellcheck.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [ssh, cli]
    eget:
      package: akinoiro/ssh-list
      state: present
      args:
        - --to=~/.local/bin/ssh-list.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [ai, cli]
    eget:
      package: anomalyco/opencode
      state: present
      args:
        - --to=~/.local/bin/opencode.exe
        - --upgrade-only
        - --asset=".zip"

  - tags: [cli]
    go:
      package: github.com/dhth/act3
      version: latest
      state: present

  - tags: [security, cli]
    pipx:
      package: pwdgen
      state: present

  - name: register local bins
    path:
      paths:
        - ~/.local/bin
      state: present

  # Includes: define a package once under packages/<name>/main.yml (using
  # the same 'tasks:' shape as this file) and pull it in with 'include:'.
  # See README.md's "Includes" section for the full mechanism, including
  # 'src'/'script' path resolution and '${{ ... }}' template expressions.
  - name: install lolcat
    tags: [lolcat, cli]
    include:
      name: lolcat
      state: present

  - name: install sysinternals
    tags: [sysinternals, cli]
    include:
      name: sysinternals
      state: latest
