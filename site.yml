---
vars:
  monitoring: false
  cli: false
  tweaks: false
  terminal: false
  security: false
  languages: false
    # rust: false
    # python: false
    # nodejs: false
    # golang: false
    # java: false
      # jre: false
      # jdk: EclipseAdoptium.Temurin.21.JDK
    # dotnet: false
    # ruby: false
      # install:
      #   override: '/verysilent /tasks="assocfiles,modpath" /DIR="d:\ruby" /currentuser'
  shell:
    pwsh:
      profile: '~/.config/powershell/Microsoft.PowerShell_profile.ps1'
      aliases: '~/.config/powershell/custom/aliases/dev.ps1'
      dev: '~/Development'
      ws: '~/Development'
      omp:
        profile: '~/.config/powershell/default.omp.json'

  defaults:
    languages:
      java:
        jre: false
        jdk: Microsoft.OpenJDK.25
      nodejs: OpenJS.NodeJS
      dotnet:
        runtime: false # Microsoft.DotNet.Runtime.10
        sdk: Microsoft.DotNet.SDK.10
      python: 'Python.Python.3.13'
      ruby: RubyInstallerTeam.Ruby.4.0
    shell:
      pwsh:
        profile: '~/.config/powershell/Microsoft.PowerShell_profile.ps1'
        aliases: '~/.config/powershell/custom/aliases/dev.ps1'
        dev: '~/Development'
        ws: '~/Development'
        omp:
          profile: '~/.config/powershell/default.omp.json'

tasks:

  - name: Install Package Managers
    include:
      name: roles/package-managers
      state: latest

  - name: Install Languages
    when: (languages is mapping) or (languages is boolean and languages)
    include:
      name: roles/languages
      state: present
    tags:
      - languages

  - name: Set up Development Environment
    include:
      name: roles/development
      state: present
    tags:
      - development

  - name: Set up Shell Environment
    when: (shell is mapping) or (shell is boolean and shell)
    include:
      name: roles/shell
      state: present
    tags:
      - shell

  - name: System Tweak Tools
    when: (tweaks is mapping) or (tweaks is boolean and tweaks)
    include:
      name: packages/tweaks
      state: present
    tags:
      - tweaks
      - configuration
      - utility

  - name: Install Windows Terminal
    when: (terminal is mapping) or (terminal is boolean and terminal)
    include:
      name: packages/terminal
      state: present
    tags:
      - terminal

  - name: Install Security Tools
    when: (security is mapping) or (security is boolean and security)
    include:
      name: roles/security
      state: present
    tags:
      - security

  - name: Install smartmontools
    include:
      name: packages/smartctl
      state: present
    when: (monitoring is mapping) or (monitoring is boolean and monitoring) 
    tags:
      - smartctl
      - monitor

  - name: Install CLI Tools
    include:
      name: packages/cli
      state: present
    when: (cli is mapping) or (cli is boolean and cli)
    tags:
      - cli


  - name: register local bins
    path:
      paths:
        - ~/.local/bin
        - ~/bin
      state: present

  # Includes: define a package once under packages/<name>/main.yml (using
  # the same 'tasks:' shape as this file) and pull it in with 'include:'.
  # See README.md's "Includes" section for the full mechanism, including
  # 'src'/'script' path resolution and '${{ ... }}' template expressions.
  - name: install lolcat
    tags: 
      - lolcat
      - cli
    include:
      name: packages/lolcat
      state: present

  - name: install sysinternals
    tags: 
      - sysinternals
      - cli
    include:
      name: packages/sysinternals
      state: latest
