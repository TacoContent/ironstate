syntax = "proto3";

package ironstate.plugin.v1;

option go_package = "github.com/TacoContent/ironstate/sdk/proto;pluginpb";

import "google/protobuf/struct.proto";

service HandlerPlugin {
  rpc ListHandlers(ListHandlersRequest) returns (ListHandlersResponse);
  rpc Test(HandlerRequest) returns (TestResponse);
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Install(HandlerRequest) returns (ExecResult);
  rpc Uninstall(HandlerRequest) returns (ExecResult);
  rpc FactName(FactNameRequest) returns (FactNameResponse);
  rpc ScanRole(ScanRoleRequest) returns (ScanRoleResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
}

service HandlerHostCallback {
  rpc RenderTemplate(RenderTemplateRequest) returns (RenderTemplateResponse);
  rpc EvaluateCondition(EvaluateConditionRequest) returns (EvaluateConditionResponse);
}

message Context {
  google.protobuf.Struct flat = 1;
  bool apply = 2;
  Become become = 3;
}

message Become {
  bool enabled = 1;
  string user = 2;
}

message HandlerRequest {
  string handler_name = 1;
  google.protobuf.Struct item = 2;
  string name = 3;
  Context context = 4;
}

message DescribeRequest {
  HandlerRequest handler = 1;
  string action = 2;
}

message TestResponse {
  bool satisfied = 1;
}

message DescribeResponse {
  string description = 1;
}

message ExecResult {
  int32 rc = 1;
  string stdout = 2;
  repeated string stdout_lines = 3;
  string stderr = 4;
  repeated string stderr_lines = 5;
  google.protobuf.Struct extra = 6;
}

message ListHandlersRequest {}

message ListHandlersResponse {
  repeated string handler_names = 1;
}

message FactNameRequest {
  string handler_name = 1;
  google.protobuf.Struct item = 2;
}

message FactNameResponse {
  string name = 1;
  bool produced = 2;
}

message ScanRoleRequest {
  string handler_name = 1;
}

message ScanRoleResponse {
  string role = 1;
  bool supported = 2;
}

message ScanRequest {
  string handler_name = 1;
  Context context = 2;
}

message ScanResponse {
  repeated ScanItem items = 1;
}

message ScanItem {
  string module = 1;
  string name = 2;
  google.protobuf.Struct config = 3;
  repeated string tags = 4;
}

message RenderTemplateRequest {
  string template = 1;
  google.protobuf.Struct variables = 2;
}

message RenderTemplateResponse {
  string rendered = 1;
}

message EvaluateConditionRequest {
  string expression = 1;
  google.protobuf.Struct variables = 2;
}

message EvaluateConditionResponse {
  bool result = 1;
}