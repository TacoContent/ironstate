---

vars:
  development:
    root: d:/Development
    oss: d:/Development/projects/github
    work: d:/Development/work/imanage
  monitoring: false
  cli: false
  languages: false
    # rust: true
    # python: true
    # nodejs: true
    # golang: true
    # java: false
    #   # jre: false
    #   # jdk: EclipseAdoptium.Temurin.21.JDK
    # dotnet: true
    # ruby: false
      # install:
      #   override: '/verysilent /tasks="assocfiles,modpath" /DIR="d:\ruby" /currentuser'
  shell:
    pwsh:
      profile: '~/.config/powershell/profile.ps1'
      aliases: '~/.config/powershell/custom/aliases/default.ps1'
      dev: '~/Development'
      ws: '~/Development'

tasks:
  - name: Setup ~/Development
    tags:
      - machine
    file:
      path: '${{ shell.pwsh.dev | default("~/Development") }}'
      type: directory
      state: present

  - name: Setup OSS Development Workspace
    tags:
      - machine
    symlinks:
      src: ${{ development.oss }}
      dest: ${{ shell.pwsh.ws | default("~/Development") | join("oss")}}
      state: ${{ package.state }}

  - name: Setup Work Development Workspace
    tags:
      - machine
    symlinks:
      src: ${{ development.work }}
      dest: ${{ shell.pwsh.ws | default("~/Development") | join("work")}}
      state: ${{ package.state }}
